[workspace]
resolver = "3"
exclude = ["third_party", "programs", "experimental", "modules"]
members = [
    "crates/lezer-adapter",
    "crates/lezer-core",
    "crates/lezer-cli",
    "crates/lezer-provider",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = { version = "1", features = ["derive"] }

# Upstream LEZ engine — official repository, pinned to the tag the public
# testnet (https://testnet.lez.logos.co) runs. Verified by RPC surface probe.
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
key_protocol = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1", features = ["client"] }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }

[workspace.lints.rust]

[workspace.lints.clippy]
