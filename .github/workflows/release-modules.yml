name: Release Basecamp Modules (.lgx & logos-repo.json)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release-lgx-catalog:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-14
            system: aarch64-darwin
          - os: macos-15-intel
            system: x86_64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Validate Catalog Manifests
        run: ./tooling/release-catalog.sh
      - name: Build Basecamp .lgx Modules
        run: |
          nix build ./modules/lezer_wallet_provider
          nix build ./modules/lezer_wallet_ui
          nix build ./modules/lezer_faucet_ui
          nix build ./modules/lezer_testimonial_ui
