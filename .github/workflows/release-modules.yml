name: Release Basecamp Modules (.lgx & logos-repo.json)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-wallet-provider:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: modules/lezer_wallet_provider

  release-wallet-ui:
    needs: [release-wallet-provider]
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: modules/lezer_wallet_ui

  release-faucet-ui:
    needs: [release-wallet-provider]
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: modules/lezer_faucet_ui

  release-testimonial-ui:
    needs: [release-wallet-provider]
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: modules/lezer_testimonial_ui
