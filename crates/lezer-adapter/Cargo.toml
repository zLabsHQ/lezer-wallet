[package]
name = "lezer-adapter"
description = "Lezer Protocol Adapter — exclusive boundary wrapping upstream Logos Execution Zone (LEZ) wallet, RPC, and circuits"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["upstream-lez"]
upstream-lez = [
    "dep:wallet",
    "dep:lee",
    "dep:lee_core",
    "dep:sequencer_service_rpc",
    "dep:system_accounts",
    "dep:programs",
]
keycard = ["upstream-lez", "wallet/keycard"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bip39.workspace = true
borsh.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

wallet = { workspace = true, optional = true }
lee = { workspace = true, optional = true }
lee_core = { workspace = true, optional = true }
sequencer_service_rpc = { workspace = true, optional = true }
system_accounts = { workspace = true, optional = true }
programs = { workspace = true, optional = true }
