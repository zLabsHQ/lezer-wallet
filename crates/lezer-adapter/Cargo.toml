[package]
name = "lezer-adapter"
description = "Lezer Protocol Adapter — exclusive boundary wrapping upstream Logos Execution Zone (LEZ) wallet, RPC, and circuits"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# In-process RISC Zero proving (as the official wallet-ffi does), so no separately
# installed `r0vm` is needed. On macOS this compiles Metal kernels and requires the
# Metal toolchain. Without it, proving uses the `r0vm` binary installed by `rzup`.
prove = ["lee/prove"]

[dependencies]
anyhow.workspace = true
bip39.workspace = true
borsh.workspace = true
bs58.workspace = true
hex.workspace = true
libc.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
zeroize.workspace = true

url = "2"
wallet.workspace = true
lee.workspace = true
lee_core.workspace = true
common.workspace = true
key_protocol.workspace = true
sequencer_service_rpc.workspace = true
risc0-binfmt = "3.0.2"
# version pins matter: in a git dep the path hint degrades to a name+version
# lookup across the repo, and experimental/ ships a colliding registry_core@1.0.0
testimonial_core = { version = "0.2.0", path = "../../programs/testimonial/core" }
token_core = { version = "0.1.0", path = "../../programs/token/core" }
registry_core = { version = "0.1.0", path = "../../programs/registry/core" }
faucet_core = { version = "0.1.0", path = "../../programs/faucet/core" }
