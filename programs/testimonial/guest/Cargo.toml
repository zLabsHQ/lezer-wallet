[package]
name = "lezer_testimonial"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Built reproducibly with `cargo risczero build --manifest-path programs/testimonial/guest/Cargo.toml`.

[[bin]]
name = "lezer_testimonial"
path = "src/main.rs"

[dependencies]
testimonial_core = { path = "../core" }
registry_core = { path = "../../registry/core" }
borsh = { version = "1", features = ["derive"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
